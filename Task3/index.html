<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- start header home section -->

    <header class="header-home">
      <!-- left side -->
      <div class="left-side">
        <img class="facebook-logo" src="media/Facebook-Logo.png" alt="Facebook-Logo" />
        <br />
        <p>
          Facebook help you connect and share
          <br />
          with the life people in your life
        </p>
      </div>

      <!-- right side -->
      <div class="right-side">
        <form action="#">
          <input type="text" placeholder="Email address or phone number" name="email" />
          <br />
          <input type="password" placeholder="Password" name="pass" />
          <br />
          <input type="submit" name="login" value="Log in" />
          <br />
          <a href="#">Forgotten Password</a>
          <hr />
          <a href="#">Create new account</a>
        </form>
      </div>
    </header>

    <!-- end header home section -->
  </body>
</html>
