<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <table class="table table-striped table-striped-columns table-hover">
      <thead>
        <tr class="table theme-primary">
          <th>#</th>
          <th>First</th>
          <th>Last</th>
          <th>Handle</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>1</th>
          <td>Mark</td>
          <td>Otto</td>
          <td>@mdo</td>
        </tr>
        <tr class="table theme-success">
          <th>2</th>
          <td>Jacob</td>
          <td>Thornton</td>
          <td>@fat</td>
        </tr>
        <tr>
          <th>3</th>
          <td>John</td>
          <td>Doe</td>
          <td>@social</td>
        </tr>
      </tbody>
    </table>
    <br />
    <div class="form-field">
      <label for="fieldText" class="form-label">Email address</label>
      <input type="email" class="form-control" id="fieldText" placeholder="name@example.com" />
      <div class="form-text">We’ll never share your email with anyone else.</div>
    </div>
    <br />
    <div class="form-field">
      <input type="checkbox" id="fieldCheck" class="check" />
      <label for="fieldCheck">Remember me</label>
    </div>
    <br />
    <button
      class="form-control combobox-toggle"
      type="button"
      data-bs-toggle="combobox"
      data-bs-name="option"
      data-bs-placeholder="Select an item…"
    >
      <span class="combobox-value">Select an item…</span>
      <svg
        class="combobox-caret"
        width="10"
        height="16"
        viewBox="0 0 10 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M0.46967 5.46967C0.762563 5.17678 1.23744 5.17678 1.53033 5.46967L5 8.93934L8.46967 5.46967C8.76256 5.17678 9.23744 5.17678 9.53033 5.46967C9.82322 5.76256 9.82322 6.23744 9.53033 6.53033L5.53033 10.5303C5.23744 10.8232 4.76256 10.8232 4.46967 10.5303L0.46967 6.53033C0.176777 6.23744 0.176777 5.76256 0.46967 5.46967Z"
          fill="currentcolor"
        />
      </svg>
    </button>
    <div class="menu">
      <button class="menu-item" type="button" data-bs-value="1">Option one</button>
      <button class="menu-item" type="button" data-bs-value="2">Option two</button>
      <button class="menu-item" type="button" data-bs-value="3">Option three</button>
    </div>
    <div class="switch">
      <input type="checkbox" value="" id="switch" role="switch" switch />
    </div>
    <div class="form-field">
      <input class="radio" name="radios" type="radio" id="radioLabel" />
      <label for="radioLabel">First example radio</label>
    </div>
    <div class="form-field">
      <input class="radio" name="radios" type="radio" id="radioLabel2" />
      <label for="radioLabel2">Second example radio</label>
    </div>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
